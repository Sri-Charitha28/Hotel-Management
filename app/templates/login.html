<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/login.css') }}">
</head>

<body>

<div class="login-container">

    <!-- Left Panel -->

    <div class="left-panel">

        <div class="brand">

            <h1>Hotel Royal</h1>

            <p>
                Welcome back!
                Login to continue your journey with us.
            </p>

        </div>

        <div class="image-section">

            <img
                src="https://images.unsplash.com/photo-1566073771259-6a8506099945"
                alt="Hotel Image"
            >

        </div>

    </div>

    <!-- Right Panel -->

    <div class="right-panel">

        <div class="form-card">

            <h2>Login</h2>

            <p>
                Enter your credentials to access your account
            </p>

            <form
                id="loginForm"
                autocomplete="off"
            >

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

                <!-- Remember Me & Forgot Password -->

                <div class="options">

                    <label for="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', path='js/login.js') }}"></script>

</body>
</html>
