{% extends "base.html" %}

{% block content %}

<link rel="stylesheet"
href="{{ url_for('static', path='css/admin_settings.css') }}">

<div class="settings-container">

    <div class="page-header">

        <h1>Settings</h1>

        <p>
            Manage hotel information and system settings
        </p>

    </div>

    <!-- HOTEL INFO -->

    <div class="settings-card">

        <h2>
            <i class="fa-solid fa-hotel"></i>
            Hotel Information
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Hotel Name</label>

                <input
                    type="text"
                    id="hotelName"
                    placeholder="Enter Hotel Name"
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="hotelEmail"
                    placeholder="Enter Email"
                >

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    id="hotelPhone"
                    placeholder="Enter Phone Number"
                >

            </div>

            <div class="form-group">

                <label>Hotel Address</label>

                <input
                    type="text"
                    id="hotelAddress"
                    placeholder="Enter Address"
                >

            </div>

        </div>

    </div>


    <!-- BUSINESS SETTINGS -->

    <div class="settings-card">

        <h2>
            <i class="fa-solid fa-briefcase"></i>
            Business Settings
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Check-In Time</label>

                <input
                    type="time"
                    id="checkInTime"
                >

            </div>

            <div class="form-group">

                <label>Check-Out Time</label>

                <input
                    type="time"
                    id="checkOutTime"
                >

            </div>

            <div class="form-group">

                <label>GST (%)</label>

                <input
                    type="number"
                    id="gst"
                    placeholder="18"
                >

            </div>

            <div class="form-group">

                <label>Currency</label>

                <select id="currency">

                    <option>INR</option>

                    <option>USD</option>

                    <option>EUR</option>

                </select>

            </div>

        </div>

    </div>


    <!-- SECURITY -->

    <div class="settings-card">

        <h2>
            <i class="fa-solid fa-lock"></i>
            Security Settings
        </h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Current Password</label>

                <input
                    type="password"
                    id="currentPassword"
                >

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    id="newPassword"
                >

            </div>

        </div>

    </div>


    <!-- ACTION BUTTONS -->

    <div class="action-buttons">

        <button
            class="save-btn"
            onclick="saveSettings()"
        >

            <i class="fa-solid fa-floppy-disk"></i>

            Save Changes

        </button>

        <button
            class="reset-btn"
            onclick="resetSettings()"
        >

            <i class="fa-solid fa-rotate-left"></i>

            Reset

        </button>

    </div>

</div>

<script src="{{ url_for('static', path='js/admin_settings.js') }}"></script>

{% endblock %}
