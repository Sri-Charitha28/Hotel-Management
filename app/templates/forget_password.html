<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/forget_password.css') }}"
    >

</head>

<body>

<div class="login-container">

    <!-- Left Panel -->

    <div class="left-panel">

        <div class="brand">

            <h1>Hotel Royal</h1>

            <p>

                Forgot your password?

                Don't worry.

                We'll send an OTP to your registered email.

            </p>

        </div>

        <div class="image-section">

            <img
                src="https://images.unsplash.com/photo-1566073771259-6a8506099945"
                alt="Hotel Image"
            >

        </div>

    </div>

    <!-- Right Panel -->

    <div class="right-panel">

        <div class="form-card">

            <h2>Forgot Password</h2>

            <p>

                Enter your registered email address.

            </p>

            <form
                id="forgotPasswordForm"
                autocomplete="off"
            >

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <button
                    type="submit"
                >

                    Send OTP

                </button>

            </form>

            <div class="back-link">

                <a href="/">

                    Back to Login

                </a>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', path='js/forget_password.js') }}"></script>

</body>

</html>
