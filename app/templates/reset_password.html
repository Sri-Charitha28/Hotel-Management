<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/reset_password.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Reset Password</h1>

        <p>

            Create your new password.

        </p>

        <form
            id="resetPasswordForm"
        >

            <input
                type="password"
                id="newPassword"
                placeholder="New Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button
                type="submit"
            >

                Reset Password

            </button>

        </form>

    </div>

</div>

<script
src="{{ url_for('static', path='js/reset_password.js') }}">
</script>

</body>

</html>
