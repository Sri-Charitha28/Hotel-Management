<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/customer_rooms.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', path='css/navbar.css') }}">
</head>
<body>

<script>
if (!localStorage.getItem("token")) {

    window.location.replace("/login");

}
</script>

{% include "navbar.html" %}
<!-- Hero Section -->

<section class="hero">

</section>

<!-- Rooms Section -->

<section class="rooms-section">

    <h2>Choose Your Room</h2>

    <div
        id="roomsContainer"
        class="rooms-container">

        <!-- Dynamic Room Cards Here -->

    </div>
    <div id="pagination" class="pagination"></div>

</section>

<script src="{{ url_for('static', path='js/customer_rooms.js') }}"></script>

<script>

function logout() {

    localStorage.clear();

    sessionStorage.clear();

    window.location.replace("/login");

}

window.addEventListener(
    "pageshow",
    function () {

        if (
            !localStorage.getItem(
                "token"
            )
        ) {

            window.location.replace(
                "/login"
            );

        }

    }
);

</script>

</body>
</html>
