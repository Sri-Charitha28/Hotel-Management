<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo-section">
            <h2>Hotel Management</h2>
            <p>Admin Panel</p>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard"
                   class="{% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/rooms-page"
                   class="{% if active_page == 'rooms' %}active{% endif %}">
                    <i class="fa-solid fa-bed"></i>
                    Rooms
                </a>
            </li>

            <li>
                <a href="/admin-bookings"
                   class="{% if active_page == 'bookings' %}active{% endif %}">
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <li>
                <a href="/admin-customers"
                   class="{% if active_page == 'customers' %}active{% endif %}">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="/admin-reports"
   class="{% if active_page == 'reports' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line"></i>
                    Reports
                </a>
            </li>

            <li>
                
            </li>

            <li>
    <a href="#" onclick="logout()" class="logout-link">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>
</li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>
<script>

window.addEventListener("pageshow", function (event) {

    const token = localStorage.getItem("token");

    if (!token) {

        window.location.replace("/login");

    }

});

</script>
<script>

const protectedPages = [
    "/dashboard",
    "/rooms-page",
    "/customers-page",
    "/bookings-page",
    "/admin-bookings",
    "/admin-customers",
    "/admin-reports"
];

if (
    protectedPages.includes(window.location.pathname)
) {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.replace("/login");

    }
}

</script>
<script>

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("name");
    localStorage.removeItem("role");
    localStorage.removeItem("user_id");
    localStorage.removeItem("customerId");

    window.location.href = "/logout";
}

</script>

</body>
</html>
