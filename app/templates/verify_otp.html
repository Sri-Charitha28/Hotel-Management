<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/verify_otp.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Verify OTP</h2>

        <p>

            Enter the 6-digit OTP sent to your email.

        </p>

        <form id="verifyOtpForm">

            <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="Enter OTP"
                required
            >

            <button type="submit">

                Verify OTP

            </button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', path='js/verify_otp.js') }}"></script>

</body>

</html>
