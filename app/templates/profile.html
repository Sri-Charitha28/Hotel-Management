<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/profile.css') }}">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Hotel Royal
        </div>

        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="#" onclick="openAllRooms()">Rooms</a></li>
            <li><a href="/my-bookings">My Bookings</a></li>
        </ul>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>

    <!-- Profile Container -->

    <div class="profile-container">

        <!-- Left Card -->

        <div class="profile-card">

            <img
                src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                alt="Profile"
                class="profile-image"
            >

            <h2 id="customerName">
                Customer Name
            </h2>

            <p id="customerEmail">
                customer@email.com
            </p>

            <p id="customerPhone">
                +91 9876543210
            </p>

        </div>

        <!-- Right Card -->

        <div class="details-card">

            <h2>
                Profile Information
            </h2>

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="text"
                    id="phone"
                >
            </div>

            <button
                class="update-btn"
            >
                Update Profile
            </button>

        </div>

    </div>

    <!-- Stats -->

    <div class="stats-container">

        <div class="stat-card">
            <h3 id="totalBookings">0</h3>
            <p>Total Bookings</p>
        </div>

        <div class="stat-card">
            <h3 id="activeBookings">0</h3>
            <p>Active Bookings</p>
        </div>

        <div class="stat-card">
            <h3>2026</h3>
            <p>Member Since</p>
        </div>

    </div>

    <script src="{{ url_for('static', path='js/profile.js') }}"></script>

</body>
</html>
